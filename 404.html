
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page you're looking for could not be found on AstroGuide.">
    <title>404 - Page Not Found | AstroGuide</title>

    <link rel="icon" type="image/png" href="./images/logo.png">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/404.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./js/global.js"></script>
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body class="error-page">

    <main class="error-main">

        <div class="error-utilities">

            <!-- Same button ID and class as Home1 -->
            <button
                type="button"
                class="st-navbar-icon-btn"
                id="themeToggle"
                aria-label="Toggle dark mode"
                title="Toggle dark mode">
                <i data-lucide="moon" aria-hidden="true"></i>
            </button>

            <!-- Same button ID and class as Home1 -->
            <button
                type="button"
                class="st-navbar-icon-btn"
                id="rtlToggle"
                aria-label="Enable RTL"
                title="Enable RTL">
                <i data-lucide="arrow-left-right" aria-hidden="true"></i>
            </button>

        </div>

        <section class="error-content">



            <div class="error-illustration" aria-hidden="true">
                <span class="error-orbit error-orbit-one"></span>
                <span class="error-orbit error-orbit-two"></span>
                <span class="error-orbit error-orbit-three"></span>
                <span class="error-star error-star-one">✦</span>
                <span class="error-star error-star-two">✧</span>
                <span class="error-star error-star-three">✦</span>
                <span class="error-number">404</span>
            </div>

            <p class="error-eyebrow">A LITTLE COSMIC DETOUR</p>

            <h1>Looks like you've lost your way.</h1>

            <p class="error-description">
                The page you're looking for may have moved, disappeared,
                or taken a different path through the universe.
            </p>

            <a href="./index.html" class="error-home-btn">
                <i data-lucide="house" aria-hidden="true"></i>
                <span>Return to Home</span>
                <i class="error-home-arrow" data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>

        </section>

    </main>

    <script>
        if (typeof lucide !== "undefined" && lucide.createIcons) {
            lucide.createIcons();
        }
    </script>

</body>
</html>
