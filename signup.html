
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F1EB">

    <title>Create Account | AstroGuide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/signup.css">
<link rel="stylesheet" href="./css/global.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body>

<main class="signup-page">

    <!-- Theme and RTL controls -->
    <div class="utility-controls">

        <button
            type="button"
            class="icon-control"
            id="themeToggle"
            aria-label="Toggle dark mode"
            title="Toggle dark mode">

            <i data-lucide="moon"></i>
        </button>

        <button
            type="button"
            class="icon-control"
            id="rtlToggle"
            aria-label="Toggle RTL"
            title="Toggle RTL">

            <i data-lucide="arrow-left-right"></i>
        </button>

    </div>

    <!-- Signup card -->
    <section class="signup-card">
                <a href="./index.html"
            id="brand"
            class="st-navbar-brand"
            aria-label="AstroGuide Home">

            <img src="./images/logo.png"
                alt="AstroGuide Logo"
                class="st-navbar-brand-logo">

            <span class="st-navbar-brand-name">
                <span class="st-brand-astro">Astro</span><span class="st-brand-guide">Guide</span>
            </span>

        </a>

        <!-- Heading -->
        <div class="card-heading">

            <p class="eyebrow">BEGIN YOUR COSMIC JOURNEY</p>

            <h1 id="signupTitle">
                Create your <em>account</em>
            </h1>

            <p class="intro">
                Join AstroGuide and discover guidance written in the stars.
            </p>

        </div>

        <!-- Signup form -->
        <form class="signup-form" id="signupForm">

            <!-- Full name -->
            <div class="form-field">

                <label for="fullName">Full name</label>

                <div class="input-wrap">

                    <i data-lucide="user-round" aria-hidden="true"></i>

                    <input
                        id="fullName"
                        name="fullName"
                        type="text"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>

                </div>

            </div>

            <!-- Email -->
            <div class="form-field">

                <label for="email">Email address</label>

                <div class="input-wrap">

                    <i data-lucide="mail" aria-hidden="true"></i>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>

            </div>

            <!-- Password -->
            <div class="form-field">

                <label for="password">Password</label>

                <div class="input-wrap password-wrap">

                    <i data-lucide="lock-keyhole" aria-hidden="true"></i>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password">

                        <i data-lucide="eye" aria-hidden="true"></i>

                    </button>

                </div>

            </div>

            <!-- Confirm password -->
            <div class="form-field">

                <label for="confirmPassword">Confirm password</label>

                <div class="input-wrap password-wrap">

                    <i data-lucide="shield-check" aria-hidden="true"></i>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password">

                        <i data-lucide="eye" aria-hidden="true"></i>

                    </button>

                </div>

            </div>

            <!-- Terms -->
            <label class="terms-row">

                <input type="checkbox" name="terms" required>

                <span class="custom-check"></span>

                <span>
                    I agree to the
                    <a href="./terms.html">Terms &amp; Conditions</a>
                    and
                    <a href="./privacy.html">Privacy Policy</a>.
                </span>

            </label>

            <!-- Submit -->
            <button class="submit-button" type="submit">

                Create account

                <i data-lucide="arrow-up-right" aria-hidden="true"></i>

            </button>

            <p class="form-message" id="formMessage" role="status"></p>

        </form>

        <!-- Login link -->
        <p class="login-prompt">
            Already have an account?
            <a href="./login.html">Sign in</a>
        </p>

        <!-- Card footer -->
        <div class="card-bottom">
            <span></span>
            <p>Guidance written in the stars</p>
            <span></span>
        </div>

    </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const root = document.documentElement;
    const body = document.body;

    const themeToggle = document.getElementById("themeToggle");
    const rtlToggle = document.getElementById("rtlToggle");

    const passwordToggles =
        document.querySelectorAll(".password-toggle");

    const signupForm = document.getElementById("signupForm");
    const password = document.getElementById("password");
    const confirmPassword =
        document.getElementById("confirmPassword");

    const formMessage = document.getElementById("formMessage");

    const THEME_KEY = "astroguidE-theme";
    const RTL_KEY = "astroguidE-rtl";

    function refreshIcons() {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    }

    // Theme
    function applyTheme(isDark) {

        body.classList.toggle("dark-mode", isDark);

        themeToggle.innerHTML = isDark
            ? '<i data-lucide="sun"></i>'
            : '<i data-lucide="moon"></i>';

        themeToggle.setAttribute(
            "aria-label",
            isDark ? "Switch to light mode" : "Switch to dark mode"
        );

        themeToggle.title = isDark
            ? "Switch to light mode"
            : "Switch to dark mode";

        document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", isDark ? "#000000" : "#F8F1EB");

        try {
            localStorage.setItem(
                THEME_KEY,
                isDark ? "dark" : "light"
            );
        } catch (error) {}

        refreshIcons();
    }

    // RTL
    function applyRTL(isRTL) {

        root.setAttribute("dir", isRTL ? "rtl" : "ltr");

        rtlToggle.setAttribute(
            "aria-label",
            isRTL ? "Switch to LTR" : "Switch to RTL"
        );

        rtlToggle.title = isRTL
            ? "Switch to LTR"
            : "Switch to RTL";

        try {
            localStorage.setItem(RTL_KEY, String(isRTL));
        } catch (error) {}
    }

    // Restore preferences
    let savedTheme = "light";
    let savedRTL = false;

    try {
        savedTheme =
            localStorage.getItem(THEME_KEY) || "light";

        savedRTL =
            localStorage.getItem(RTL_KEY) === "true";
    } catch (error) {}

    applyTheme(savedTheme === "dark");
    applyRTL(savedRTL);

    themeToggle.addEventListener("click", function () {

        applyTheme(
            !body.classList.contains("dark-mode")
        );

    });

    rtlToggle.addEventListener("click", function () {

        applyRTL(
            root.getAttribute("dir") !== "rtl"
        );

    });

    // Password visibility
    passwordToggles.forEach(function (button) {

        button.addEventListener("click", function () {

            const input =
                button.parentElement.querySelector("input");

            const show = input.type === "password";

            input.type = show ? "text" : "password";

            button.innerHTML = show
                ? '<i data-lucide="eye-off"></i>'
                : '<i data-lucide="eye"></i>';

            button.setAttribute(
                "aria-label",
                show ? "Hide password" : "Show password"
            );

            button.title = show
                ? "Hide password"
                : "Show password";

            refreshIcons();

        });

    });

    // Confirm password
    function validatePasswordMatch() {

        if (
            confirmPassword.value &&
            password.value !== confirmPassword.value
        ) {
            confirmPassword.setCustomValidity(
                "Passwords do not match."
            );
        } else {
            confirmPassword.setCustomValidity("");
        }

    }

    password.addEventListener("input", validatePasswordMatch);
    confirmPassword.addEventListener("input", validatePasswordMatch);

    // Frontend-only form validation
    signupForm.addEventListener("submit", function (event) {

        event.preventDefault();

        validatePasswordMatch();

        if (!signupForm.reportValidity()) {
            return;
        }

        formMessage.textContent =
            "Your form is valid. No account has been created.";

    });

    refreshIcons();

});
</script>

</body>
</html>
